plugins { id 'com.android.application' }
android {
    namespace 'ru.moymir.kids'
    compileSdk 35
    defaultConfig { applicationId 'ru.moymir.kids'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.2.0' }
    signingConfigs {
        release {
            storeFile rootProject.file('signing/release.p12')
            storeType 'PKCS12'
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias 'moymir'
            keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        }
    }
    buildTypes { release {
        if (System.getenv('ANDROID_KEYSTORE_PASSWORD') && rootProject.file('signing/release.p12').exists()) signingConfig signingConfigs.release
        minifyEnabled false
    } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
