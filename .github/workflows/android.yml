name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check learning program and reset
        run: node check.cjs
      - name: Build and lint release
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Prepare unsigned APK and official signing tool
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release-unsigned.apk release/moy-mir-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release/apksigner.jar
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moy-mir-build
          path: release/*
      - name: Summary
        run: echo 'Unsigned APK built and lint checked. Signing keys are kept outside GitHub. The signed APK is published separately in Releases.' >> "$GITHUB_STEP_SUMMARY"
